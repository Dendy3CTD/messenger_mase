# /etc/nginx/sites-available/mase
# После установки: sudo ln -s /etc/nginx/sites-available/mase /etc/nginx/sites-enabled/mase

server {
    listen 80;
    server_name mase.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mase.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/mase.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mase.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket endpoint
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # keep WS alive 1 hour
        proxy_send_timeout 3600s;
    }

    # Media upload
    location /upload {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        client_max_body_size 100M;
        proxy_read_timeout 60s;
    }

    # Media serve
    location /media/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        expires            30d;
        add_header         Cache-Control "public, immutable";
    }

    # Health
    location /health {
        proxy_pass http://127.0.0.1:8080;
    }
}
